name: Preview

on:
  pull_request:

# `wrangler-action` (with `gitHubToken`) creates a GitHub Deployment so the
# preview URL is linked to the PR, which needs `deployments: write` in addition
# to read access to the repo contents.
permissions:
  contents: read
  deployments: write

jobs:
  preview:
    name: Cloudflare Pages preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - run: npm ci
        working-directory: webui

      # Esmeralda is the default network; the template address is hardcoded in
      # webui/lib/config.ts. No /walletd proxy here: previews are static and don't
      # connect to a wallet daemon yet.
      - name: Build
        run: npm run build
        working-directory: webui
        env:
          VITE_NETWORK: Esmeralda

      - name: Deploy preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/client --project-name=tariorg
          workingDirectory: webui
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
