name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tariorg template uses nightly-only features (integer_casts,
      # float_conversions), so the whole workspace must build on nightly, not
      # stable.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          # The template tests compile the crate to WASM via
          # tari_template_test_tooling, which shells out to
          # `cargo build --target wasm32-unknown-unknown`.
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  webui:
    name: Web UI (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
